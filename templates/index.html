<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Legal Metrology Compliance Scanner</title>
<style>
  :root {
    --bg: #0B0F14;
    --bg-2: #10151D;
    --card: #151B24;
    --border: #262F3A;
    --ink: #EAF0F6;
    --grey: #93A1B0;
    --saffron: #FF9933;
    --saffron-bright: #FF7A1A;
    --green: #138808;
    --green-bright: #1FAE3A;
    --navy: #0B1F66;
    --white: #FFFFFF;
    --success-bg: #10331F;
    --success-text: #4ADE80;
    --danger-bg: #3A1418;
    --danger-text: #FB7185;
    --warning-bg: #3A2B0E;
    --warning-text: #FBBF24;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background: var(--bg);
    min-height: 100vh;
  }

  /* ---------------- Flag stripe ---------------- */
  .flag-stripe {
    height: 6px;
    width: 100%;
    background: linear-gradient(90deg, var(--saffron) 0%, var(--saffron) 33%, var(--white) 33%, var(--white) 66%, var(--green) 66%, var(--green) 100%);
  }

  /* ---------------- Header ---------------- */
  header {
    position: relative;
    overflow: hidden;
    padding: 30px 24px 42px;
    background: linear-gradient(120deg, #1A1006, var(--bg) 55%, #071A0B);
    background-size: 200% 200%;
    animation: gradientShift 12s ease infinite;
    color: var(--white);
  }
  @keyframes gradientShift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  header::before, header::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    filter: blur(6px);
    animation: floatBlob 9s ease-in-out infinite;
    opacity: 0.35;
  }
  header::before { width: 200px; height: 200px; top: -70px; right: 6%; background: var(--saffron); animation-delay: 0s; }
  header::after  { width: 140px; height: 140px; bottom: -60px; left: 10%; background: var(--green); animation-delay: 2.5s; }
  @keyframes floatBlob {
    0%, 100% { transform: translateY(0) scale(1); }
    50%      { transform: translateY(-16px) scale(1.08); }
  }
  header h1 {
    margin: 0;
    font-size: 22px;
    position: relative;
    z-index: 1;
    animation: fadeInUp 0.6s ease both;
  }
  header p {
    margin: 6px 0 0;
    font-size: 13px;
    color: #C7D2DE;
    position: relative;
    z-index: 1;
    animation: fadeInUp 0.6s ease 0.1s both;
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes popIn {
    0%   { opacity: 0; transform: scale(0.7); }
    70%  { transform: scale(1.05); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes shimmer {
    0%   { background-position: -200px 0; }
    100% { background-position: 200px 0; }
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulseRing {
    0%   { box-shadow: 0 0 0 0 rgba(251,113,133,0.35); }
    100% { box-shadow: 0 0 0 14px rgba(251,113,133,0); }
  }

  .wrap {
    max-width: 980px;
    margin: -22px auto 40px;
    padding: 0 24px;
    position: relative;
    z-index: 2;
  }

  /* ---------------- Cards ---------------- */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 22px;
    margin-bottom: 22px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    animation: fadeInUp 0.5s ease both;
    transition: box-shadow .25s ease;
  }
  .card:hover { box-shadow: 0 14px 36px rgba(255,153,51,0.10); }

  .card h2 {
    font-size: 14px;
    color: var(--saffron-bright);
    margin: 0 0 16px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card h2::before {
    content: "";
    width: 8px; height: 8px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--saffron), var(--green));
  }

  /* ---------------- Upload zone ---------------- */
  .dropzone {
    border: 2px dashed #3A4453;
    border-radius: 12px;
    padding: 30px 20px;
    text-align: center;
    cursor: pointer;
    background: var(--bg-2);
    transition: border-color .2s ease, transform .15s ease;
  }
  .dropzone:hover { border-color: var(--saffron); transform: translateY(-2px); }
  .dropzone.drag-over {
    border-color: var(--saffron-bright);
    background: #221708;
    transform: scale(1.01);
  }
  .dropzone .label { font-weight: 700; font-size: 15px; color: var(--white); }
  .dropzone .hint { font-size: 12px; color: var(--grey); margin-top: 5px; }
  input[type=file] { display: none; }

  .upload-options {
    display: flex;
    gap: 12px;
    margin-bottom: 14px;
  }
  .upload-btn {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    background: var(--bg-2);
    color: var(--ink);
    font-weight: 700;
    font-size: 13.5px;
    cursor: pointer;
    transition: border-color .2s ease, transform .15s ease, background .2s ease;
  }
  .upload-btn:hover { transform: translateY(-2px); }
  .upload-btn.gallery:hover { border-color: var(--saffron); }
  .upload-btn.camera:hover { border-color: var(--green-bright); }
  .upload-btn svg { width: 18px; height: 18px; flex-shrink: 0; }
  .upload-btn.gallery svg { stroke: var(--saffron-bright); }
  .upload-btn.camera svg { stroke: var(--green-bright); }
  .upload-btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

  .thumb-grid { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 18px; }
  .thumb { position: relative; width: 128px; animation: popIn 0.35s cubic-bezier(.2,1.4,.4,1) both; }
  .thumb img {
    width: 128px; height: 128px; object-fit: cover;
    border-radius: 10px; border: 1px solid var(--border); display: block;
    transition: transform .2s ease;
  }
  .thumb:hover img { transform: scale(1.04); }
  .thumb .remove-btn {
    position: absolute; top: -8px; right: -8px;
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--danger-text); color: #1A1006;
    border: 2px solid var(--bg); font-size: 14px; line-height: 1;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: transform .15s ease;
  }
  .thumb .remove-btn:hover { transform: scale(1.15); }
  .thumb .thumb-label { font-size: 11px; color: var(--grey); text-align: center; margin-top: 5px; }
  .image-count { font-size: 12.5px; color: var(--saffron-bright); margin-top: 12px; font-weight: 600; }

  /* ---------------- Buttons ---------------- */
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: linear-gradient(120deg, var(--saffron-bright), #FF5A1F);
    color: #1A1006;
    border: none; padding: 12px 24px; border-radius: 999px;
    font-size: 14px; font-weight: 800; cursor: pointer; margin-top: 18px;
    box-shadow: 0 6px 18px rgba(255,122,26,0.35);
    transition: transform .15s ease, box-shadow .15s ease, opacity .15s ease;
  }
  .btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 22px rgba(255,122,26,0.45); }
  .btn:active:not(:disabled) { transform: translateY(0) scale(0.98); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }
  .btn.secondary { background: linear-gradient(120deg, var(--green-bright), var(--green)); color: var(--white); box-shadow: 0 6px 18px rgba(31,174,58,0.3); }
  .btn.ghost {
    background: transparent; color: var(--saffron-bright);
    border: 1.5px solid var(--saffron); box-shadow: none;
  }
  .btn.ghost:hover { background: #221708; }

  .spinner {
    width: 14px; height: 14px;
    border: 2px solid rgba(26,16,6,0.4);
    border-top-color: #1A1006;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: none;
  }
  .btn.loading .spinner { display: inline-block; }

  .status-line { font-size: 13px; color: var(--grey); margin-top: 12px; min-height: 18px; }
  .status-line.shimmering {
    background: linear-gradient(90deg, var(--grey) 40%, var(--saffron-bright) 50%, var(--grey) 60%);
    background-size: 400px 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shimmer 1.4s linear infinite;
    font-weight: 600;
  }

  /* ---------------- Results ---------------- */
  #resultsCard { display: none; }
  #resultsCard.show { display: block; animation: fadeInUp 0.5s ease both; }

  .verdict-banner {
    padding: 14px 18px; border-radius: 12px; font-weight: 700; font-size: 14.5px;
    margin-bottom: 18px; animation: fadeInUp 0.45s ease both;
  }
  .verdict-banner.COMPLIANT { background: var(--success-bg); color: var(--success-text); }
  .verdict-banner.NON_COMPLIANT {
    background: var(--danger-bg); color: var(--danger-text);
    animation: fadeInUp 0.45s ease both, pulseRing 2s ease-out 0.5s 2;
  }
  .verdict-banner.NEEDS_REVIEW { background: var(--warning-bg); color: var(--warning-text); }

  .chip-row { display: flex; flex-wrap: wrap; gap: 9px; margin-bottom: 18px; }
  .chip {
    padding: 9px 16px; border-radius: 999px; font-size: 12.5px; font-weight: 700;
    cursor: pointer; border: 1.5px solid transparent; user-select: none;
    transition: transform .15s ease, box-shadow .15s ease;
    animation: fadeInUp 0.35s ease both;
  }
  .chip:hover { transform: translateY(-2px) scale(1.03); box-shadow: 0 6px 14px rgba(0,0,0,0.25); }
  .chip.ok { background: var(--success-bg); color: var(--success-text); border-color: #1F5C36; }
  .chip.violation { background: var(--danger-bg); color: var(--danger-text); border-color: #6B2530; }
  .chip.active { outline: 2px solid var(--saffron); outline-offset: 2px; }

  .field-detail {
    background: var(--bg-2);
    border-left: 4px solid var(--saffron);
    border-radius: 10px;
    padding: 16px 18px;
    font-size: 13.5px;
    max-height: 0; overflow: hidden; opacity: 0;
    transition: max-height .3s ease, opacity .3s ease, padding .3s ease;
    padding-top: 0; padding-bottom: 0;
  }
  .field-detail.visible { max-height: 300px; opacity: 1; padding-top: 16px; padding-bottom: 16px; }
  .field-detail .row { margin-bottom: 6px; color: #D6DEE7; }
  .field-detail .row b { color: var(--saffron-bright); }

  table.decl-table { width: 100%; border-collapse: collapse; font-size: 13px; animation: fadeIn 0.4s ease both; }
  table.decl-table th, table.decl-table td {
    border: 1px solid var(--border); padding: 9px 11px; text-align: left; vertical-align: top;
  }
  table.decl-table th { background: linear-gradient(120deg, var(--saffron-bright), var(--green)); color: #1A1006; font-size: 12px; }
  table.decl-table td { color: #D6DEE7; }
  table.decl-table tr:nth-child(even) td { background: var(--bg-2); }
  .status-ok { color: var(--success-text); font-weight: 700; }
  .status-bad { color: var(--danger-text); font-weight: 700; }

  #reportLink { margin-top: 16px; }
  #reportLink a {
    color: #1A1006; font-weight: 800; text-decoration: none;
    background: linear-gradient(120deg, var(--saffron-bright), var(--green-bright));
    padding: 10px 20px; border-radius: 999px; display: inline-block;
    box-shadow: 0 6px 18px rgba(255,122,26,0.3);
    animation: popIn 0.4s ease both;
  }

  .hidden { display: none; }
</style>
</head>
<body>

<div class="flag-stripe"></div>

<header>
  <h1>Legal Metrology Compliance Scanner</h1>
  <p>Packaged Commodities Rules, 2011 — automated label declaration check</p>
</header>

<div class="wrap">

  <div class="card">
    <h2>1. Upload Product Label Photos</h2>
    <div class="upload-options">
      <button type="button" class="upload-btn gallery" id="galleryBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2"></rect>
          <circle cx="8.5" cy="8.5" r="1.5"></circle>
          <path d="M21 15l-5-5L5 21"></path>
        </svg>
        Choose from Gallery
      </button>
      <button type="button" class="upload-btn camera" id="cameraBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
          <circle cx="12" cy="13" r="4"></circle>
        </svg>
        Take Photo
      </button>
    </div>
    <div class="dropzone" id="dz-upload">
      <div class="label">Click or drag photos here</div>
      <div class="hint">Up to 4 images — front, back, side, any angle with printed declarations</div>
      <input type="file" id="imageInput" accept="image/*" multiple>
      <input type="file" id="cameraInput" accept="image/*" capture="environment">
    </div>
    <div class="thumb-grid" id="thumbGrid"></div>
    <div class="image-count" id="imageCount"></div>
    <button class="btn" id="scanBtn" onclick="runScan()">
      <span class="spinner"></span>
      <span class="btn-label">Analyze Compliance</span>
    </button>
    <div class="status-line" id="statusLine"></div>
  </div>

  <div class="card" id="resultsCard">
    <h2>2. Compliance Result</h2>
    <div id="verdictBanner" class="verdict-banner"></div>

    <div class="chip-row" id="chipRow"></div>
    <div class="field-detail" id="fieldDetail"></div>

    <div style="margin-top:20px;">
      <button class="btn secondary" onclick="showTable()">View Full Declaration Table</button>
      <button class="btn ghost" onclick="generateReport()">Generate PDF Report</button>
    </div>

    <div id="tableWrap" class="hidden" style="margin-top:18px;"></div>
    <div id="reportLink"></div>
  </div>

</div>

<script>
let currentJobId = null;
let currentResult = null;
let selectedFiles = [];
const MAX_IMAGES = 4;

const dz = document.getElementById('dz-upload');
const imageInput = document.getElementById('imageInput');
const cameraInput = document.getElementById('cameraInput');
const galleryBtn = document.getElementById('galleryBtn');
const cameraBtn = document.getElementById('cameraBtn');

dz.addEventListener('click', () => imageInput.click());
galleryBtn.addEventListener('click', () => imageInput.click());
cameraBtn.addEventListener('click', () => cameraInput.click());

imageInput.addEventListener('change', (e) => {
  addFiles(Array.from(e.target.files));
  e.target.value = '';
});

cameraInput.addEventListener('change', (e) => {
  addFiles(Array.from(e.target.files));
  e.target.value = '';
});

['dragenter', 'dragover'].forEach(evt => {
  dz.addEventListener(evt, (e) => {
    e.preventDefault();
    dz.classList.add('drag-over');
  });
});
['dragleave', 'drop'].forEach(evt => {
  dz.addEventListener(evt, (e) => {
    e.preventDefault();
    dz.classList.remove('drag-over');
  });
});
dz.addEventListener('drop', (e) => {
  const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/'));
  addFiles(files);
});

function addFiles(newFiles) {
  for (const f of newFiles) {
    if (selectedFiles.length >= MAX_IMAGES) {
      alert(`You can upload up to ${MAX_IMAGES} images. Extra files were skipped.`);
      break;
    }
    selectedFiles.push(f);
  }
  renderThumbs();
}

function renderThumbs() {
  const grid = document.getElementById('thumbGrid');
  const countLine = document.getElementById('imageCount');
  grid.innerHTML = '';

  selectedFiles.forEach((file, idx) => {
    const url = URL.createObjectURL(file);
    const thumb = document.createElement('div');
    thumb.className = 'thumb';
    thumb.style.animationDelay = (idx * 0.06) + 's';
    thumb.innerHTML = `
      <img src="${url}">
      <div class="remove-btn" onclick="removeImage(${idx})">&times;</div>
      <div class="thumb-label">Image ${idx + 1}</div>
    `;
    grid.appendChild(thumb);
  });

  countLine.textContent = selectedFiles.length
    ? `${selectedFiles.length} of ${MAX_IMAGES} images selected`
    : '';

  const atMax = selectedFiles.length >= MAX_IMAGES;
  galleryBtn.disabled = atMax;
  cameraBtn.disabled = atMax;
}

function removeImage(idx) {
  selectedFiles.splice(idx, 1);
  renderThumbs();
}

async function runScan() {
  const statusLine = document.getElementById('statusLine');
  const scanBtn = document.getElementById('scanBtn');

  if (selectedFiles.length === 0) {
    statusLine.textContent = 'Please upload at least one label image.';
    return;
  }

  const formData = new FormData();
  selectedFiles.forEach(f => formData.append('images', f));

  scanBtn.disabled = true;
  scanBtn.classList.add('loading');
  statusLine.textContent = 'Uploading images and analysing declarations...';
  statusLine.classList.add('shimmering');

  try {
    const res = await fetch('/scan', { method: 'POST', body: formData });
    const data = await res.json();

    scanBtn.disabled = false;
    scanBtn.classList.remove('loading');
    statusLine.classList.remove('shimmering');

    if (!data.success) {
      statusLine.textContent = 'Error: ' + (data.error || 'Unknown error');
      return;
    }

    currentJobId = data.job_id;
    currentResult = data.result;
    statusLine.textContent = `Done in ${data.elapsed_seconds}s.`;
    renderResults(currentResult);

  } catch (err) {
    scanBtn.disabled = false;
    scanBtn.classList.remove('loading');
    statusLine.classList.remove('shimmering');
    statusLine.textContent = 'Request failed: ' + err.message;
  }
}

function renderResults(result) {
  const card = document.getElementById('resultsCard');
  card.classList.add('show');

  const banner = document.getElementById('verdictBanner');
  banner.className = 'verdict-banner ' + result.overall_verdict;
  banner.textContent = 'Overall Verdict: ' + result.overall_verdict.replace('_', ' ')
    + (result.product_name_guess ? '  ·  ' + result.product_name_guess : '');

  const chipRow = document.getElementById('chipRow');
  chipRow.innerHTML = '';
  result.declarations.forEach((d, idx) => {
    const chip = document.createElement('div');
    chip.className = 'chip ' + (d.compliant ? 'ok' : 'violation');
    chip.style.animationDelay = (idx * 0.05) + 's';
    chip.textContent = d.label + (d.compliant ? ' ✓' : ' ✕');
    chip.onclick = () => showField(d, chip);
    chipRow.appendChild(chip);
  });

  document.getElementById('fieldDetail').classList.remove('visible');
  document.getElementById('tableWrap').classList.add('hidden');
  document.getElementById('reportLink').innerHTML = '';

  card.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function showField(d, chipEl) {
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  chipEl.classList.add('active');

  const detail = document.getElementById('fieldDetail');
  detail.innerHTML = `
    <div class="row"><b>Field:</b> ${d.label}</div>
    <div class="row"><b>Found:</b> ${d.found ? 'Yes' : 'No'}</div>
    <div class="row"><b>Value:</b> ${d.value || '—'}</div>
    <div class="row"><b>Source image:</b> ${d.source_image || '—'}</div>
    <div class="row"><b>Status:</b> ${d.compliant
        ? '<span class="status-ok">Compliant</span>'
        : '<span class="status-bad">Non-compliant / Missing</span>'}</div>
    ${d.reason ? `<div class="row"><b>Reason:</b> ${d.reason}</div>` : ''}
  `;
  detail.classList.add('visible');
}

function showTable() {
  const wrap = document.getElementById('tableWrap');
  wrap.classList.toggle('hidden');
  if (wrap.classList.contains('hidden')) return;

  let rows = currentResult.declarations.map(d => `
    <tr>
      <td>${d.label}</td>
      <td>${d.value || '—'}</td>
      <td>${d.source_image || '—'}</td>
      <td>${d.compliant ? '<span class="status-ok">Compliant</span>' : '<span class="status-bad">Violation</span>'}</td>
      <td>${d.reason || '—'}</td>
    </tr>
  `).join('');

  wrap.innerHTML = `
    <table class="decl-table">
      <tr><th>Field</th><th>Detected Value</th><th>Source</th><th>Status</th><th>Reason</th></tr>
      ${rows}
    </table>
  `;
}

async function generateReport() {
  if (!currentJobId) return;
  const reportLink = document.getElementById('reportLink');
  reportLink.textContent = 'Generating report...';

  try {
    const res = await fetch('/report/' + currentJobId, { method: 'POST' });
    const data = await res.json();
    if (!data.success) {
      reportLink.textContent = 'Error: ' + (data.error || 'Unknown error');
      return;
    }
    reportLink.innerHTML = `<a href="${data.pdf_url}" target="_blank">Open Compliance Report (PDF)</a>`;
  } catch (err) {
    reportLink.textContent = 'Request failed: ' + err.message;
  }
}
</script>

</body>
</html>
